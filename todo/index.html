<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Todo</h1>

    <form id="new-task-form" autocomplete="off">
      <div class="row">
        <label for="new-task-title" class="visually-hidden">New task</label>
        <input id="new-task-title" name="title" type="text" placeholder="What needs doing?" maxlength="200" required>
        <button type="submit">Add</button>
      </div>
      <div class="row details">
        <div class="field">
          <label for="new-task-due">Due date</label>
          <input id="new-task-due" name="dueDate" type="date">
        </div>
        <div class="field">
          <label for="new-task-repeat">Repeat</label>
          <select id="new-task-repeat" name="repeat">
            <option value="">Never</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        <div class="field grow">
          <label for="new-task-tags">Tags</label>
          <input id="new-task-tags" name="tags" type="text" placeholder="work, home" maxlength="200">
        </div>
      </div>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section class="filters" aria-label="Filters">
      <fieldset id="status-filter" class="segmented">
        <legend class="visually-hidden">Show</legend>
        <label><input type="radio" name="status" value="all" checked><span>All</span></label>
        <label><input type="radio" name="status" value="incomplete"><span>Incomplete</span></label>
        <label><input type="radio" name="status" value="completed"><span>Completed</span></label>
      </fieldset>
      <div class="field tag-filter">
        <label for="tag-filter">Tag</label>
        <select id="tag-filter">
          <option value="">All tags</option>
        </select>
      </div>
    </section>

    <ul id="task-list" aria-label="Tasks"></ul>
    <p id="empty-state" class="empty" hidden></p>
    <p id="task-count" class="count" aria-live="polite"></p>
  </main>

  <script src="tasks.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
